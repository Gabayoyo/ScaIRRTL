name: Format

# Run on every push to main and every change on pull requests
on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  # Formatting checks
  format:
    name: "Checks"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Coursier cache
      uses: coursier/cache-action@v7

    - name: Restore Mill incremental cache
      id: restore-mill-cache
      uses: actions/cache/restore@v4
      with:
        path: out
        key: mill-incremental-format-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          mill-incremental-format-

    - name: Run format checks (incremental)
      id: cached-run
      continue-on-error: ${{ steps.restore-mill-cache.outputs.cache-matched-key != '' }}
      run: ./mill checkFormat

    - name: Run format checks (clean retry)
      if: ${{ steps.restore-mill-cache.outputs.cache-matched-key != '' && steps.cached-run.outcome == 'failure' }}
      run: |
        rm -rf out
        ./mill checkFormat

    - name: Save Mill incremental cache
      uses: actions/cache/save@v4
      with:
        path: out
        key: mill-incremental-format-${{ github.run_id }}-${{ github.run_attempt }}
