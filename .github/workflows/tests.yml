name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  filechecks:
    name: "Filechecks"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Coursier cache
      uses: coursier/cache-action@v7

    - name: Python setup
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install lit and filecheck
      run: pip install "lit<23" filecheck

    # Restore Mill's incremental build output to avoid recompiling from scratch.
    # The restore-keys prefix means any prior run's cache is better than nothing.
    - name: Restore Mill incremental cache
      id: restore-mill-cache
      uses: actions/cache/restore@v4
      with:
        path: out
        key: mill-incremental-filechecks-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          mill-incremental-filechecks-

    # First attempt: use the restored incremental cache.
    # If the cache is stale and causes a failure, we fall through to a clean run.
    - name: Run filechecks (incremental)
      id: cached-run
      continue-on-error: ${{ steps.restore-mill-cache.outputs.cache-matched-key != '' }}
      run: ./mill filechecks.run

    # Clean-slate retry, only triggered when the cached incremental run failed.
    - name: Run filechecks (clean retry)
      if: ${{ steps.restore-mill-cache.outputs.cache-matched-key != '' && steps.cached-run.outcome == 'failure' }}
      run: |
        rm -rf out
        ./mill filechecks.run

    - name: Save Mill incremental cache
      uses: actions/cache/save@v4
      with:
        path: out
        key: mill-incremental-filechecks-${{ github.run_id }}-${{ github.run_attempt }}
