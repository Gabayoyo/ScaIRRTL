import lit.formats
import os
import shutil

config.name = "ScaIRRTL"
config.test_source_root = os.path.dirname(__file__)
config.test_format = lit.formats.ShTest(execute_external=True)
config.suffixes = ['.mlir']

scairrtl_opt = os.getenv(
    "SCAIRRTL_OPT",
    os.path.abspath(os.path.join(config.test_source_root, '../../out/opt/launcher.dest/run'))
)
config.substitutions.append(('scairrtl-opt', scairrtl_opt))

mlir_opt = shutil.which('mlir-opt')
if mlir_opt:
    config.available_features.add('mlir-opt')
    config.substitutions.append(('mlir-opt', mlir_opt))

mlir_runner = shutil.which('mlir-runner')
if mlir_runner:
    config.available_features.add('mlir-runner')
    config.substitutions.append(('mlir-runner', mlir_runner))
