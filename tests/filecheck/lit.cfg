import lit.formats
import os

config.name = "ChocoLa"
config.test_source_root = os.path.dirname(__file__)
config.test_format = lit.formats.ShTest(execute_external=True)
config.suffixes = ['.cola']

choco_opt = os.getenv(
    "CHOCO_OPT",
    os.path.abspath(os.path.join(config.test_source_root, '../../out/main/launcher.dest/run'))
)
config.substitutions.append(('choco-opt', choco_opt))
